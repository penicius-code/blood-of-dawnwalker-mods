[Mod]
Id = AlwaysFinishers
Name = Always Finishers
Author = penicius-code
Version = 0.5.1
Description = Finishers trigger at a higher enemy HP, so fewer killing blows skip the finisher. Numpad * turns it on and off.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Enabled
Description = Off restores the game's own thresholds.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Enabled

[Setting.threshold]
Id = threshold
Type = integer
Label = Finisher HP threshold
Description = Enemy health at which a finisher becomes possible. Vanilla is 20 % for guards, 10 % for heavies and rogues. Never lowered below vanilla.
Group = General
Minimum = 10
Maximum = 100
Step = 5
Decimals = 0
Suffix = %
Default = 30
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Threshold

[Setting.toast]
Id = toast
Type = toggle
Label = On-screen message
Description = Shows ON / OFF when you press the key.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Toast

[Setting.logging]
Id = logging
Type = toggle
Label = Debug log
Description = Writes [AlwaysFinishers] lines to UE4SS.log. Only needed for bug reports.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Logging

[Setting.tickms]
Id = tickms
Type = integer
Label = Check interval
Description = How often new enemy types are looked up.
Group = General
Minimum = 100
Maximum = 2000
Step = 100
Decimals = 0
Suffix = ms
Default = 100
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = TickMs

[Setting.rearm]
Id = rearm
Type = toggle
Label = Keep enemies finishable
Description = Enemies at or below the threshold stay marked for a finisher, also when blinded or when their AI drops the mark. Off = threshold only.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Rearm