[Settings]
; 1 = on, 0 = off (Numpad * toggles it and writes it here)
Enabled = 1
; Enemy HP % at which finishers become possible (vanilla 20 for longsword guards, 10 for heavies and rogues). Never lowered.
Threshold = 30
; 1 = show ON / OFF on screen when Numpad * is pressed
Toast = 1
; 1 = write [AlwaysFinishers] lines to UE4SS.log (test build); 0 for release
Logging = 1
; ms between enemy checks
TickMs = 100
; 1 = keep low-HP enemies marked ready for a finisher (also when blinded or when the AI drops the flag)
Rearm = 1
