; Wolf Form Beta settings
; Changes are picked up while the game is running (checked every 2 seconds), except ToggleKey (restart).

[Settings]
; 1 = mod active, 0 = vanilla (wolf only during Haste)
Enabled = 1

; Key that switches between wolf and human. Uses UE4SS key names, for example:
; NUM_SEVEN, F7, HOME, PAGE_DOWN. Leave empty to disable the hotkey.
ToggleKey = NUM_SEVEN

; 1 = after a wolf Haste, Coen stays a wolf. 0 = wolf only by the hotkey.
HoldAfterHaste = 0

; 1 = wolf form only at night (ends when Coen turns human at dawn). 0 = also by day.
NightOnly = 1

; 1 = no walk->run / run->walk transition animations while a wolf (the wolf has none; legs froze
; on walk -> run in 0.1.0). 0 = vanilla transitions.
NoSpeedUpTransitions = 1

; 1 = write WolfForm.log next to Dawnwalker.exe (for bug reports)
Logging = 0
