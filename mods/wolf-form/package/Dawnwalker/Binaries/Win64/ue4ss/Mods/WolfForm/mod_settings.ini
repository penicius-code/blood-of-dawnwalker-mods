[Mod]
Id = WolfForm
Name = Wolf Form Beta
Author = penicius-code
Version = 0.2.0
Description = Numpad 7 switches between wolf and human. Optional: stay a wolf after a wolf Haste. Combat, dialogue, Shadowstep, climbing, crouching or interacting turn him human. The key is set in config.ini.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Wolf Form
Description = Off: vanilla, the wolf only exists during Haste.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Enabled

[Setting.holdafterhaste]
Id = holdafterhaste
Type = toggle
Label = Stay a wolf after Haste
Description = On: Coen stays a wolf when a wolf Haste ends. Off: wolf only by the hotkey.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = HoldAfterHaste

[Setting.nightonly]
Id = nightonly
Type = toggle
Label = Night only
Description = On: wolf form ends when Coen turns human at dawn, and the hotkey only works at night.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = NightOnly

[Setting.nospeedup]
Id = nospeedup
Type = toggle
Label = No speed-up transitions
Description = Wolf goes straight from walk to run (fix for frozen legs on walk to run). Off: vanilla transitions.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = NoSpeedUpTransitions

[Setting.logging]
Id = logging
Type = toggle
Label = Debug log
Description = Writes WolfForm.log next to Dawnwalker.exe. Only needed for bug reports.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Logging
