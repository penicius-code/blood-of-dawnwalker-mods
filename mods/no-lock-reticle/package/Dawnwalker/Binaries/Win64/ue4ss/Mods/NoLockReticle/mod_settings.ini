[Mod]
Id = NoLockReticle
Name = No Lock Reticle
Author = penicius-code
Version = 0.4.0
Description = Hides the combat target / lock-on reticle (diamond, lock frame, direction arrows) or makes it faint, and fades enemy health bars. Changes apply within 2 seconds.

[Setting.Enabled]
Id = Enabled
Type = toggle
Label = Enabled
Description = Off: the reticle is shown as in the game.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Enabled

[Setting.Opacity]
Id = Opacity
Type = integer
Label = Reticle opacity
Description = 0%: the reticle is gone. 10%: faint. 100%: the game's own.
Group = General
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Suffix = %
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Opacity

[Setting.BarOpacity]
Id = BarOpacity
Type = integer
Label = Target health bar opacity
Description = Health bar of the enemy you target or lock. 0%: gone. 100%: the game's own.
Group = General
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Suffix = %
Default = 35
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = BarOpacity

[Setting.OtherBarOpacity]
Id = OtherBarOpacity
Type = integer
Label = Other enemies health bar opacity
Description = Health bars of all other enemies in the fight. 0%: gone. 100%: the game's own.
Group = General
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Suffix = %
Default = 25
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = OtherBarOpacity

[Setting.BossBarOpacity]
Id = BossBarOpacity
Type = integer
Label = Boss health bar opacity
Description = Big boss health bar at the top of the screen. 100%: left as the game shows it. Works with DynamicHUD's boss bar scale.
Group = General
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Suffix = %
Default = 50
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = BossBarOpacity

[Setting.Logging]
Id = Logging
Type = toggle
Label = Log
Description = Writes change based lines with [NoLockReticle] to UE4SS.log.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Logging
