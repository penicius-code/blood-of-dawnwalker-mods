; No Lock Reticle settings. Also editable in the Mod Setting Menu. Re-read every 2 seconds.

[Settings]
; 1 = on, 0 = off (the reticle is shown as in the game)
Enabled = 1

; Reticle opacity in percent. 0 = gone, 10 = faint, 100 = the game's own.
Opacity = 0

; Health bar of the targeted / locked enemy, opacity in percent. 0 = gone, 100 = the game's own.
BarOpacity = 35

; Health bars of all other enemies in combat, opacity in percent.
OtherBarOpacity = 25

; Big boss health bar at the top of the screen, opacity in percent. 100 = left alone (the game's own).
BossBarOpacity = 50

; 1 = change based lines with [NoLockReticle] in UE4SS.log (test build)
Logging = 0

; Check interval in milliseconds (how fast a re-shown reticle is hidden again)
TickMs = 100
