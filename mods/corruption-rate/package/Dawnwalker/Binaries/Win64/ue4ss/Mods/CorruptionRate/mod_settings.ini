[Mod]
Id = CorruptionRate
Name = Corruption Rate
Author = penicius-code
Version = 0.1.0
Description = Slows the Vrakhiri corruption: only a set share of every gain is kept (drinks, the blood after a drink, vials and other items). Story rewards are left alone. Changes apply within 2 seconds.

[Setting.Enabled]
Id = Enabled
Type = toggle
Label = Enabled
Description = Off: corruption grows at the game's own speed again.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Enabled

[Setting.GainPercent]
Id = GainPercent
Type = integer
Label = Corruption gain kept
Description = Share of every corruption gain that is kept. 10%: drinking fills the corruption ten times slower than in the game. 100%: the game's speed. Above 100% (up to 300%, for testing): corruption grows faster than in the game.
Group = General
Minimum = 0
Maximum = 300
Step = 5
Decimals = 0
Suffix = %
Default = 10
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = GainPercent

[Setting.Logging]
Id = Logging
Type = toggle
Label = Log
Description = Writes one line per gain to CorruptionRate.log next to Dawnwalker.exe: what the game added and what was kept.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Logging
