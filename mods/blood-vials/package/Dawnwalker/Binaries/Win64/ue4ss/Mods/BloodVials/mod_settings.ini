[Mod]
Id = BloodVials
Name = Blood Vials
Author = penicius-code
Version = 1.2.0
Description = ] next to a dead or unconscious body fills the human or animal blood vial. [ drinks a dose and refills part of your blood bar. Keys are set in config.ini.

[Setting.range]
Id = range
Type = picker
Label = Reach
Description = How close Coen has to be to the body.
Group = General
PresetValues = 100|150|200
PresetLabels = 1 m|1.5 m|2 m
Default = 150
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Range

[Setting.maxextract]
Id = maxextract
Type = picker
Label = Extractions per body
Description = How many times the same body can be extracted from.
Group = General
PresetValues = 1|2|3|5
PresetLabels = 1|2|3|5
Default = 3
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = MaxExtract

[Setting.capacity]
Id = capacity
Type = picker
Label = Vial size
Description = How many bodies a vial holds.
Group = General
PresetValues = 1|3|5
PresetLabels = 1 body|3 bodies|5 bodies
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Capacity

[Setting.dosesperfill]
Id = dosesperfill
Type = picker
Label = Drinks per body
Description = How many drinks the blood of one body gives.
Group = General
PresetValues = 1|2|3
PresetLabels = 1|2|3
Default = 2
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = DosesPerFill

[Setting.humanrestore]
Id = humanrestore
Type = picker
Label = Human blood refills
Description = Share of the blood bar one drink of human blood refills.
Group = General
PresetValues = 20|40|60|100
PresetLabels = 20%|40%|60%|100%
Default = 20
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = HumanRestore

[Setting.animalrestore]
Id = animalrestore
Type = picker
Label = Animal blood refills
Description = Share of the blood bar one drink of animal blood refills.
Group = General
PresetValues = 10|20|40|60
PresetLabels = 10%|20%|40%|60%
Default = 10
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = AnimalRestore

[Setting.drinkfirst]
Id = drinkfirst
Type = picker
Label = Drink first
Description = Which vial is drunk first when both hold blood.
Group = General
PresetValues = 1|2
PresetLabels = Human|Animal
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = DrinkFirst

[Setting.healdamage]
Id = healdamage
Type = toggle
Label = Heal permanent damage
Description = A drink also refills the dark blood segments lost to permanent damage.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = HealDamage

[Setting.gesture]
Id = gesture
Type = toggle
Label = Drinking animation
Description = Coen drinks with a short upper-body animation. Off = instant.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Gesture

[Setting.logging]
Id = logging
Type = toggle
Label = Debug log
Description = Writes [BloodVials] lines to UE4SS.log. Only needed for bug reports.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Logging
