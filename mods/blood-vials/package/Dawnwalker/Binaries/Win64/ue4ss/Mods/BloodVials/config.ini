; Blood Vials settings
; Read on every key press (the keys only at game start).
; What the vials hold is kept in state.txt (written by the mod).

[Settings]
; Keys. UE4SS key names: OEM_FOUR = [, OEM_SIX = ], DIVIDE = Numpad /.
; Changing them needs a game restart. Leave empty for no key.
DrinkKey = OEM_FOUR
ExtractKey = OEM_SIX
; Plays the next extraction animation candidate (nothing is filled); for picking one. Empty = off.
AnimTestKey =

; How close Coen has to be to the body, in cm (horizontal, to the body's hips, head or origin).
; 50 to 500. 150 = 1.5 m.
Range = 150

; How many times the same body can be extracted from (1 to 10). After that: "The blood has gone cold".
MaxExtract = 3

; How many bodies a vial holds (1 to 10), and how many drinks one body gives (1 to 10).
Capacity = 1
DosesPerFill = 2

; Share of Coen's blood bar one drink refills, in percent (1 to 100).
; With 2 drinks per body: human 2 x 20 = 40%, animal 2 x 10 = 20% per fill.
HumanRestore = 20
AnimalRestore = 10

; Corruption (vampire mutation charges) per drink of human blood, 0 to 10 (0 = off). Animal blood adds none.
; 1.5 = a vanilla human blood vial (guess). If the Corruption Rate mod is installed, only its GainPercent
; share of this is added, like for vanilla vials (20% -> 0.30).
HumanCorruption = 1.5

; Which vial is drunk first when both hold blood: 1 = human, 2 = animal.
DrinkFirst = 1

; 1 = a drink also refills segments lost to permanent blood damage (the dark ones) and carries over into
; the next segment, like the vanilla blood vials. 0 = only up to the damaged maximum.
HealDamage = 1

; Drinking animation: 1 = on, 0 = off (instant). Coen's upper body only, he can keep walking.
; No animation in wolf form or dialogue (instant then).
Gesture = 1
; Which drinking animation (1-10), the moment of the sip and the cut (0 = full length), in the
; animation's own seconds; they scale with AnimTime. StopBlend = blend out in seconds.
Anim = 5
DrinkAt = 2.0
StopAt = 0
StopBlend = 0.4
AnimSlot = Upperbody_Override
; How long the drinking animation lasts, in seconds (it is sped up to fit). 0 = normal speed (about 4 s).
AnimTime = 1.15

; Extraction animation: which candidate (1-11, see AnimTestKey), 0 = none (instant fill).
; 2 = crouching to a low basin.
ExtractAnim = 2
; Moment the vial is filled and the cut (0 = full length), in the animation's own seconds.
FillAt = 3.0
ExtractStopAt = 0
; How long the extraction animation lasts, in seconds (sped up to fit). 0 = use ExtractSpeed.
ExtractAnimTime = 0
; Play speed when ExtractAnimTime is 0. 1.38 = 38% faster (5.5 s -> 4.0 s).
ExtractSpeed = 1.38
; DefaultSlot = whole body (crouches). Upperbody_Override = upper body only.
ExtractSlot = DefaultSlot

; 1 = if the AI query finds no body, also check every character in the world (native list, no hitch;
; needed for spawned corpses, which have no AI stub).
; 0 = AI query only.
Scan = 1

; 1 = log to UE4SS.log with tag [BloodVials]. Only needed for bug reports.
; (Also logs how the vanilla blood vials refill, for comparison.)
Logging = 0
