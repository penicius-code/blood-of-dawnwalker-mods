[Mod]
Id = LevelCeiling
Name = Level Ceiling
Author = penicius-code
Version = 1.1.0
Description = Keeps enemies within reach of Coen's level when they start fighting him: enemies far above him are brought down to a cap, and (optionally) enemies far below him are brought up. A changed enemy gets the real stats of its new level. Changes apply within 5 seconds, also to a fight in progress.

[Setting.Enabled]
Id = Enabled
Type = toggle
Label = Enabled
Description = Off returns enemies in the current fight to their own level and leaves new ones alone.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Enabled

[Setting.CombatLog]
Id = CombatLog
Type = toggle
Label = Combat log
Description = Writes a few lines per fight to LevelCeiling.log next to Dawnwalker.exe: each enemy's level before and after, Coen's lowest health, and the mod's own time. Written in the background; no measurable effect on performance. Turn it off if you don't need it.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = CombatLog

[Setting.NormalCap]
Id = NormalCap
Type = integer
Label = Normal enemies: most levels above Coen
Description = The highest a normal enemy can be above Coen. Anything stronger is brought down to this. The game itself puts enemies of your area 3 levels above you, so 3 changes nothing in a normal fight and only tames enemies from higher areas. Lower = easier, higher = harder.
Group = Stronger enemies
Minimum = 0
Maximum = 10
Step = 1
Decimals = 0
Default = 3
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = NormalCap

[Setting.BossCap]
Id = BossCap
Type = integer
Label = Bosses: most levels above Coen
Description = The same for bosses. 6 matches the game's own boss offset, so normal boss fights stay as designed. Lower = easier bosses.
Group = Stronger enemies
Minimum = 0
Maximum = 15
Step = 1
Decimals = 0
Default = 6
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = BossCap

[Setting.GapKept]
Id = GapKept
Type = integer
Label = Level gap kept
Description = How much of an enemy's lead over Coen is kept before the cap applies. 100%: enemies up to the cap are untouched, only stronger ones are capped. 50%: every enemy above Coen loses half its lead (4 above becomes 2 above), so normal fights get easier too.
Group = Stronger enemies
Minimum = 10
Maximum = 100
Step = 10
Decimals = 0
Suffix = %
Default = 100
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = GapKept

[Setting.LighterHealth]
Id = LighterHealth
Type = toggle
Label = Lighter health for stronger enemies
Description = Enemies above Coen keep the damage of their level but get the health of a lower level: they stay dangerous but die faster.
Group = Stronger enemies
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = LighterHealth

[Setting.HealthGapPercent]
Id = HealthGapPercent
Type = integer
Label = Health levels kept
Description = How much of the level lead counts for health. 35%: an enemy 3 levels above gets the health of 1 level above. 0%: the health of Coen's level. 100%: no change.
Group = Stronger enemies
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Suffix = %
Default = 35
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = HealthGapPercent
VisibleWhen = LighterHealth
VisibleValues = 1

[Setting.RaiseWeaker]
Id = RaiseWeaker
Type = toggle
Label = Raise weaker enemies
Description = Brings enemies far below Coen up toward his level, so old areas don't become trivial. Off: weaker enemies keep their own level.
Group = Weaker enemies
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = RaiseWeaker

[Setting.FloorGap]
Id = FloorGap
Type = integer
Label = Weaker enemies: most levels below Coen
Description = The lowest a weaker enemy can be below Coen. Anything weaker is brought up to this. 5 at Coen 20: a level 12 enemy becomes 15, a level 17 enemy stays 17. 0: every weaker enemy is raised to Coen's level.
Group = Weaker enemies
Minimum = 0
Maximum = 20
Step = 1
Decimals = 0
Default = 5
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = FloorGap
VisibleWhen = RaiseWeaker
VisibleValues = 1
