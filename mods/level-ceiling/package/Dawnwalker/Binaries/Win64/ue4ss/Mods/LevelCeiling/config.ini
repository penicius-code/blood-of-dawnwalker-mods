; Level Ceiling settings. Also editable in the Mod Setting Menu.
; Checked every 5 seconds; a fight in progress is updated right away.

[Settings]
; 1 = on, 0 = off (enemies in the current fight go back to their own level)
Enabled = 1

; Most levels an enemy can be above Coen.
NormalCap = 3
BossCap = 6

; Share of the level difference kept before the cap, in percent.
; 50 = an enemy 4 levels above Coen ends up 2 above. 100 = only the cap applies.
GapKept = 100

; 1 = enemies above Coen hit like their new level but get the health of a lower level.
LighterHealth = 0
; Share of the levels above Coen that count for health, in percent.
; 35 = an enemy 3 levels above gets the health of 1 level above. 0 = health of Coen's level.
HealthGapPercent = 35

; 1 = enemies more than FloorGap levels below Coen are raised to Coen - FloorGap.
RaiseWeaker = 0
FloorGap = 5

; 1 = a few lines per fight in LevelCeiling.log next to Dawnwalker.exe
CombatLog = 1
