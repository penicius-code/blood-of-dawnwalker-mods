[Mod]
Id = ImmersiveHealing
Name = Immersive Healing
Author = penicius-code
Version = build 13
Description = Food lasts much longer and heals slowly; salves and ointments are small top-ups; stamina drinks last longer. Changes apply within 5 seconds.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Enabled
Description = Off restores vanilla food, medicine and drink effects.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Enabled

[Setting.food_seconds]
Id = food_seconds
Type = integer
Label = Food duration
Description = How long a food effect lasts. 0 uses the duration multiplier on the vanilla duration instead.
Group = Food
Minimum = 0
Maximum = 1800
Step = 30
Decimals = 0
Suffix = s
Default = 300
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = FoodDurationSeconds

[Setting.food_duration_multiplier]
Id = food_duration_multiplier
Type = slider
Label = Food duration multiplier
Description = Used only when Food duration is 0.
Group = Food
Minimum = 0.5
Maximum = 10
Step = 0.5
Decimals = 1
Suffix = x
Default = 3
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = DurationMultiplier

[Setting.food_heal]
Id = food_heal
Type = slider
Label = Food healing strength
Description = 1 is vanilla, 0.05 is slow, realistic regeneration.
Group = Food
Minimum = 0.01
Maximum = 2
Step = 0.01
Decimals = 2
Suffix = x
Default = 0.05
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = FoodHealMultiplier

[Setting.stack_limit]
Id = stack_limit
Type = integer
Label = Same food stack limit
Description = How many of the same food can run at once. 1 means no stacking (vanilla, default); 2 or more lets the same dish stack.
Group = Food
Minimum = 1
Maximum = 10
Step = 1
Decimals = 0
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = StackLimit

[Setting.stack_expiration]
Id = stack_expiration
Type = picker
Label = When a stack runs out
Description = Only with a stack limit of 2 or more. Clear ends all stacks together. Taper ends one stack and the rest continue with a fresh timer.
Group = Food
PresetValues = 0|1
PresetLabels = Clear all|Taper
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = StackExpiration

[Setting.medicine_heal]
Id = medicine_heal
Type = slider
Label = Salve healing strength
Description = Healing per second of regenerative salves. 1 is vanilla. 0.08 gives the medium salve 0.2 % per second.
Group = Medicine
Minimum = 0.01
Maximum = 5
Step = 0.01
Decimals = 2
Suffix = x
Default = 0.08
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = MedicineHealMultiplier

[Setting.ointment_small]
Id = ointment_small
Type = integer
Label = Small ointment heal
Description = Share of max health restored by the small ointment. Vanilla is 30 %.
Group = Medicine
Minimum = 0
Maximum = 100
Step = 1
Decimals = 0
Suffix = %
Default = 2
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = OintmentSmallHealPercent

[Setting.ointment_medium]
Id = ointment_medium
Type = integer
Label = Medium ointment heal
Description = Share of max health restored by the mending ointment and the ancient healing salve. Vanilla is 50 %.
Group = Medicine
Minimum = 0
Maximum = 100
Step = 1
Decimals = 0
Suffix = %
Default = 4
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = OintmentMediumHealPercent

[Setting.ointment_big]
Id = ointment_big
Type = integer
Label = Big ointment heal
Description = Share of max health restored by the big ointment. Vanilla is 75 %.
Group = Medicine
Minimum = 0
Maximum = 100
Step = 1
Decimals = 0
Suffix = %
Default = 8
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = OintmentBigHealPercent

[Setting.medicine_seconds]
Id = medicine_seconds
Type = integer
Label = Salve duration
Description = How long a salve effect lasts. 0 uses the salve duration multiplier on the vanilla 15 seconds.
Group = Medicine
Minimum = 0
Maximum = 1800
Step = 15
Decimals = 0
Suffix = s
Default = 60
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = MedicineDurationSeconds

[Setting.medicine_duration_multiplier]
Id = medicine_duration_multiplier
Type = slider
Label = Salve duration multiplier
Description = Used only when Salve duration is 0.
Group = Medicine
Minimum = 0.5
Maximum = 10
Step = 0.5
Decimals = 1
Suffix = x
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = MedicineDurationMultiplier

[Setting.stamina_seconds]
Id = stamina_seconds
Type = integer
Label = Stamina drink duration
Description = How long the faster stamina regeneration from cocktails, alcohol and drinks lasts. Vanilla is 30 s; 0 is vanilla. Stamina tonics stay vanilla.
Group = Drinks
Minimum = 0
Maximum = 1800
Step = 30
Decimals = 0
Suffix = s
Default = 180
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = StaminaDurationSeconds

[Setting.logging]
Id = logging
Type = toggle
Label = Logging
Description = Write details to UE4SS.log and ImmersiveHealing.log. Troubleshooting only.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Logging
