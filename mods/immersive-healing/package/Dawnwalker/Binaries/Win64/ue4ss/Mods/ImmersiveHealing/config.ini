; Immersive Healing settings. Also editable in the Mod Setting Menu.
; Checked every 5 seconds; a change is applied right away.

[Settings]
; 1 = mod active, 0 = vanilla food, medicine and drink effects
Enabled = 1

; FOOD (fruit, berries, food, meals)
; How long a food effect lasts, in seconds. 300 = 5 minutes.
; 0 = use DurationMultiplier on the vanilla duration instead.
FoodDurationSeconds = 300
DurationMultiplier = 3

; Food healing strength. 1 = vanilla, 0.05 = 5 % (slow, realistic regeneration).
; Takes over from Configurable Combat Overhaul's item_healing: don't run both, they would multiply.
FoodHealMultiplier = 0.05

; How many of the same food can run at once. 1 = no stacking (vanilla, default).
; Food already lasts long, so stacking is optional: 2 or more lets the same dish stack.
StackLimit = 1

; Only matters when StackLimit is 2 or more. What happens when the timer runs out on a stack:
; 0 (or clear) = all stacks end together
; 1 (or taper) = one stack ends, the rest continue with a fresh timer
StackExpiration = 1

; MEDICINE (regenerative salves and mending ointments)
; Salve healing strength. 1 = vanilla. 0.08 = medium salve 0.2 % per second
; (small 0.12 %, big 0.28 %). With 60 s the medium salve heals 12 %; vanilla is 37.5 % in 15 s.
MedicineHealMultiplier = 0.08

; Ointments (instant heal): percentage of max health restored, by tier.
; Vanilla: small 30, medium 50 (mending ointment, ancient healing salve), big 75.
OintmentSmallHealPercent = 2
OintmentMediumHealPercent = 4
OintmentBigHealPercent = 8

; How long a salve effect lasts, in seconds. 60 = 1 minute.
; 0 = use MedicineDurationMultiplier on the vanilla 15 seconds instead.
MedicineDurationSeconds = 60
MedicineDurationMultiplier = 1

; STAMINA DRINKS (cocktails, alcohol, plain drinks with faster stamina regeneration)
; How long the stamina effect lasts, in seconds. Vanilla 30. 0 = vanilla.
; Stamina tonics (the Medicaments potions) are timed differently and stay vanilla.
StaminaDurationSeconds = 180

; 1 = write details to UE4SS.log and ImmersiveHealing.log next to Dawnwalker.exe (troubleshooting only)
Logging = 0
