; Hitch Watch settings (read at game start)
; HitchMs: a frame counts as a hitch when it is at least 2x the normal frame time AND this many ms longer
HitchMs = 25
; SummaryMinutes: minutes of play (in the world, not paused) between summary lines
SummaryMinutes = 5
; TailLog: 1 = read UE4SS.log to name mods near hitches, count errors and list mod changes; 0 = frame times only
TailLog = 1
; MaxLogMB: HitchWatch.log size before it is renamed to HitchWatch.old.log
MaxLogMB = 2
