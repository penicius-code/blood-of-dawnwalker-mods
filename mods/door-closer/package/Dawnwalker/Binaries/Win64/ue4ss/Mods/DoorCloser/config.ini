; Door Closer settings
; Read on every key press, so changes apply without a restart (except Key and HoldKey).

[Settings]
; Key: tap near an open door closes it. With Bash = 1, hold at a locked door forces it open.
; UE4SS key names, e.g. NUM_FIVE, F9, END. Changing it needs a game restart. Leave empty to disable.
Key = NUM_FIVE

; Unreal name of the same key, used to check that it is still held. Empty = derived from Key
; (NUM_FIVE -> NumPadFive). Only needed for keys the mod can't translate.
HoldKey =

; How far away (cm) a door may be. 350 = about 3.5 m.
Range = 350

; 1 = animated close, 2 = instant close (no animation)
Method = 1

; 1 = holding the key at a locked door forces it open (plain locked, time-locked and quest doors;
; doors that need a key stay locked). The lock stays broken in your save. Off by default.
Bash = 0

; How long (ms) the key must be held to force a door.
HoldMs = 500

; Only with Bash = 1: 1 = doors that belong to a quest ask for a second hold (within 10 s) before they are forced.
QuestWarning = 1

; 1 = toasts show the door's lock state and quest tag count (for bug reports).
ShowInfo = 1

; 1 = log to UE4SS.log with tag [DoorCloser] (for bug reports)
Logging = 0
