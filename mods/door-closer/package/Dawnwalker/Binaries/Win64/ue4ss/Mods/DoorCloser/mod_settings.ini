[Mod]
Id = DoorCloser
Name = Door Closer
Author = penicius-code
Version = 1.1.0
Description = Tap Numpad 5 near an open door to close it. Optionally hold it at a locked door to force it open. The key is set in config.ini.

[Setting.method]
Id = method
Type = picker
Label = Close style
Description = Animated swing or instant snap shut.
Group = General
PresetValues = 1|2
PresetLabels = Animated|Instant
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Method

[Setting.bash]
Id = bash
Type = toggle
Label = Force locked doors (optional)
Description = Holding the key at a locked door forces it open, quest doors included. Doors that need a key stay locked. The lock stays broken in your save. Off = the key only closes doors.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Bash

[Setting.questwarning]
Id = questwarning
Type = toggle
Label = Quest door warning
Description = Only when forcing is on: doors that belong to a quest warn first and need a second hold within 10 seconds.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = QuestWarning

[Setting.showinfo]
Id = showinfo
Type = toggle
Label = Door info toast
Description = Toasts show the door's lock state and quest tag count. For bug reports.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = ShowInfo

[Setting.logging]
Id = logging
Type = toggle
Label = Debug log
Description = Writes [DoorCloser] lines to UE4SS.log. Only needed for bug reports.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Logging
