[Mod]
Id = BloodWash
Name = Blood Wash
Author = penicius-code
Version = 0.8.2
Description = Numpad 3 washes the blood off Coen's body and clothes, Numpad 6 wipes the blood off his mouth with a gesture, Numpad 9 does it crouching. Keys are set in config.ini.

[Setting.bodygesture]
Id = bodygesture
Type = toggle
Label = Body wash gesture (Numpad 3)
Description = Numpad 3 plays a short gesture (Coen brushes off his shoulder) and the blood goes mid-gesture. Off = instant.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = BodyGesture

[Setting.mouthgesture]
Id = mouthgesture
Type = toggle
Label = Mouth wipe gesture (Numpad 6)
Description = Numpad 6 plays the face-rub gesture and the blood goes mid-gesture. Off = instant wipe.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = MouthGesture

[Setting.crouchwipe]
Id = crouchwipe
Type = picker
Label = Crouching mouth wipe (Numpad 9)
Description = Crouching gesture (standing version while moving), instant wipe without animation, or Off = Numpad 9 does nothing.
Group = General
PresetValues = 1|2|0
PresetLabels = Crouching gesture|Instant|Off
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = CrouchWipe

[Setting.bodyhands]
Id = bodyhands
Type = toggle
Label = Classic body wash gesture (Numpad 3)
Description = On = Numpad 3 plays the old calm hands-together gesture instead of the shoulder brush.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = BodyHands

[Setting.mouthbrush]
Id = mouthbrush
Type = toggle
Label = Shoulder brush for the mouth wipe (Numpad 6)
Description = On = Numpad 6 plays the shoulder brush gesture instead of the face rub. Numpad 9 keeps the crouching face rub.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = MouthBrush

[Setting.bodyrate]
Id = bodyrate
Type = slider
Label = Body wash gesture speed (Numpad 3)
Description = Play speed of the Numpad 3 gesture. 1 = normal, 1.5 = 50% faster. The blood still goes at the same point of the gesture.
Group = General
Minimum = 0.5
Maximum = 4
Step = 0.05
Decimals = 2
Suffix = x
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = BodyRate

[Setting.wiperate]
Id = wiperate
Type = slider
Label = Mouth wipe gesture speed (Numpad 6)
Description = Play speed of the Numpad 6 face rub. 1 = normal.
Group = General
Minimum = 0.5
Maximum = 4
Step = 0.05
Decimals = 2
Suffix = x
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = WipeRate

[Setting.crouchrate]
Id = crouchrate
Type = slider
Label = Crouching mouth wipe speed (Numpad 9)
Description = Play speed of the Numpad 9 crouching face rub. 1 = normal.
Group = General
Minimum = 0.5
Maximum = 4
Step = 0.05
Decimals = 2
Suffix = x
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = CrouchRate

[Setting.permanent]
Id = permanent
Type = toggle
Label = Long-lasting blood
Description = Mouth and body blood last as long as the two sliders below and are not wiped by the game early. Loading a save still starts clean. Turning it off needs a game restart.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = PermanentBlood

[Setting.mouthseconds]
Id = mouthseconds
Type = slider
Label = Mouth blood lasts
Description = Seconds the feeding blood on the mouth lasts before it fades (with Long-lasting blood on). Applies within a few seconds.
Group = General
Minimum = 10
Maximum = 3600
Step = 10
Decimals = 0
Suffix = s
Default = 1200
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = MouthSeconds

[Setting.bodyseconds]
Id = bodyseconds
Type = slider
Label = Body blood lasts
Description = Seconds combat blood on the body and clothes lasts before it fades (with Long-lasting blood on). Applies within a few seconds.
Group = General
Minimum = 10
Maximum = 3600
Step = 10
Decimals = 0
Suffix = s
Default = 1200
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = BodySeconds

[Setting.biteblood]
Id = biteblood
Type = toggle
Label = Voracious Bite leaves blood
Description = Voracious Bite puts blood on Coen's mouth, like a normal feed.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = BiteBlood

[Setting.keepmouth]
Id = keepmouth
Type = toggle
Label = Keep mouth blood
Description = Puts the feeding blood back when it vanishes suddenly before its time is up (wolf form, some abilities). Numpad 6 / 9 still wipe it.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = KeepMouthBlood

[Setting.dialoguemouth]
Id = dialoguemouth
Type = toggle
Label = Dialogue wipes mouth blood
Description = The feeding blood on Coen's mouth vanishes when a dialogue or cutscene starts and does not come back.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = DialogueClearsMouth

[Setting.logging]
Id = logging
Type = toggle
Label = Debug log
Description = Writes [BloodWash] lines to UE4SS.log. Only needed for bug reports.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = Logging
