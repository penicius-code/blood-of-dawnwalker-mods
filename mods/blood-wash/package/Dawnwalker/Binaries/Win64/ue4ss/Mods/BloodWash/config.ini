; Blood Wash settings
; Read on every key press, so changes apply without a restart (except the keys).

[Settings]
; Washes the combat blood off Coen's body and clothes. UE4SS key names, e.g. NUM_THREE, F9, END.
; Changing a key needs a game restart. Leave empty to disable that key.
BodyKey = NUM_THREE

; Wipes the feeding blood off Coen's mouth with a gesture: he rubs his mouth, the blood goes mid-gesture.
; In dialogue, cutscenes and wolf form there is no gesture and the blood goes at once.
MouthKey = NUM_SIX

; Same mouth wipe, crouching (whole body). While moving, the standing version plays instead.
CrouchKey = NUM_NINE

; Audition key: each press plays the next TestN animation below (Test1, Test2, ... then from the start).
; It cleans nothing. Empty = off. Changing it needs a game restart.
TestKey = 

; Crouching wipe key: 1 = crouching gesture, 2 = instant wipe (no animation), 0 = the key does nothing.
CrouchWipe = 1

; 1 = the mouth key plays the face-rub gesture. 0 = instant wipe, no animation.
MouthGesture = 1

; 1 = the body wash plays a short gesture (shoulder brush, or hands together with BodyHands = 1) and the blood goes mid-gesture. 0 = instant.
BodyGesture = 1

; Hands-together gesture: seconds after it starts when the body blood goes.
BodyClearAt = 1.0

; Seconds after the gesture starts when the mouth blood goes.
WipeClearAt = 1.5

; Seconds after the gesture starts when it is cut short (Coen is done rubbing his mouth). 0 = play it to the end (3.67 s).
WipeStopAt = 2.1

; Same for the body gesture. 0 = play it to the end (2.8 s). 1.0 = ends when the blood goes (BodyClearAt).
BodyStopAt = 1.0

; Seconds a cut-short gesture takes to blend back to Coen's normal pose.
StopBlend = 0.4

; 1 = Numpad 3 plays the old hands-together gesture (BodyClearAt / BodyStopAt) instead of the shoulder brush.
BodyHands = 0

; 1 = Numpad 6 plays the shoulder brush too (instead of the face rub); the mouth blood goes at BrushClearAt. Numpad 9 unchanged.
MouthBrush = 0

; Shoulder brush timing, in animation seconds (scaled by BodyRate): when the blood goes, and where the gesture is cut (0 = full 5.67 s).
BrushClearAt = 2.5
BrushStopAt = 0

; Play speed per key: 1.0 = normal, 1.5 = 50% faster. All ClearAt / StopAt times follow the speed.
BodyRate = 1.0
WipeRate = 1.0
CrouchRate = 1.0

; Play speed of the audition (TestKey) animations.
TestRate = 1.0

; 1 = keep the feeding blood on the mouth during its lifetime: if it vanishes suddenly before its time is up
; (wolf form, some abilities), it is put back. When the time is up it fades normally. The mouth keys wipe it.
KeepMouthBlood = 1

; 1 = long-lasting blood: mouth blood lasts MouthSeconds, body and clothes blood lasts BodySeconds.
; Mouth: the game's dialogue/time-of-day wipes switched off. Body: the dialogue wipe still happens.
; Loading a save still starts clean (the game does not save blood). Turning it off needs a game restart
; to bring the game's own times back.
PermanentBlood = 1

; How long the feeding blood on the mouth lasts, in seconds, before it fades. 20 = 20 s, 1200 = 20 min.
MouthSeconds = 1200

; How long combat blood on the body and clothes lasts, in seconds, before it fades.
BodySeconds = 1200

; 1 = Voracious Bite leaves blood on the mouth (the game only does that for a normal feed).
BiteBlood = 1

; 1 = the feeding blood on the mouth is wiped automatically when a dialogue or cutscene starts,
; and does not come back. 0 = it stays (LastingBlood keeps it through dialogues).
DialogueClearsMouth = 0

; How big a drop within 1 s counts as a reset (mouth blood runs 0 to about 1).
ResetThreshold = 0.1

; 1 = log to UE4SS.log with tag [BloodWash] (for bug reports)
Logging = 0

; Advanced: which animation and slot each gesture uses. Empty = built-in default.
; Slots on Coen: Upperbody_Override (upper body), DefaultSlot (whole body), UpperbodyMask, Actions,
; Grounded Slot, Hit, Override, Parry&Block. Animations must be made for Coen's skeleton (SK_Coen_IK_Skeleton).
BodyAnim =
BodySlot = Upperbody_Override
WipeAnim =
WipeSlot = Upperbody_Override
WipeCrouchSlot = DefaultSlot
