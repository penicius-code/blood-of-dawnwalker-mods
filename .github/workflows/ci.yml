name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lua:
    name: Lua syntax (Lua 5.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Compile every Lua file (syntax only)
        run: |
          set -e
          find . -name '*.lua' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            echo "checking $f"
            luac5.4 -p "$f"
          done

  lualint:
    name: "Lint: lualint (crash and stutter rules)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests of the linter
        run: python tools/test_lualint.py
      - name: "Lint every Lua file (fails on ERROR; WARN and NOTE are printed)"
        run: python tools/lualint.py mods research
